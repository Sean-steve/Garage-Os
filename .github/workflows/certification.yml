name: Sprint 1-14 Reconciliation Certification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - reconcile/sprints-1-14-r1

permissions:
  contents: read

concurrency:
  group: garage-os-r1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Typecheck, tests, build and security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: file:./data/ci-garage-os.db
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      OBJECT_STORAGE_PROVIDER: memory
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Repository hygiene guard
        shell: bash
        run: |
          if git ls-files 'data/*.db' 'data/*.db-wal' 'data/*.db-shm' | grep -q .; then
            echo "Runtime database artifacts must not be committed."
            exit 1
          fi

      - name: Authentication regression guard
        shell: bash
        run: |
          if grep -E "authenticate\(\{ optional: true \}\)" \
            src/server/api/bookingRouter.ts \
            src/server/api/operationsRouter.ts \
            src/server/api/roadsideRouter.ts \
            src/server/api/towingRouter.ts \
            src/server/dispatch/dispatchRouter.ts >/dev/null 2>&1; then
            echo "Optional authentication regression detected on a protected Sprint 10-14 surface."
            exit 1
          fi

          if grep -E "searchParams\.get\('(userId|role|providerId)'\)" \
            src/server/dispatch/realtimeBus.ts >/dev/null 2>&1; then
            echo "Query-string realtime identity regression detected."
            exit 1
          fi

      - name: Dispatch truthfulness regression guard
        shell: bash
        run: |
          if grep -E "eta_minutes[^\n]*(\|\|[[:space:]]*25|:[[:space:]]*25)|estimated_arrival_minutes[^\n]*25" \
            src/server/roadside/roadsideService.ts \
            src/server/dispatch/adapters/roadsideAdapter.ts \
            src/server/dispatch/dispatchService.ts >/dev/null 2>&1; then
            echo "Fabricated roadside ETA fallback detected."
            exit 1
          fi

          if grep -E "350000|650000|let dist = 8\.5|unit_default" \
            src/server/dispatch/adapters/roadsideAdapter.ts \
            src/server/dispatch/adapters/towingAdapter.ts \
            src/server/towing/matchingEngine.ts >/dev/null 2>&1; then
            echo "Fabricated roadside/towing price, distance or unit fallback detected."
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test suite
        run: bun run test

      - name: Production build
        run: bun run build
