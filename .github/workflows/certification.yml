name: Garage OS Certification

on:
  push:
    branches:
      - main
      - phase-r1-reconciliation-certification
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  certify:
    name: Typecheck, Test, Build & Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files 'data/*.db' 'data/*.db-shm' 'data/*.db-wal' | grep -q .; then
            echo "Runtime SQLite artifacts must not be committed."
            exit 1
          fi
          if grep -R --line-number --exclude='*.test.ts' --exclude-dir=node_modules "userId.*searchParams\|role.*searchParams\|providerId.*searchParams" src/server/dispatch; then
            echo "Realtime identity must not be trusted from URL query parameters."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          APP_ENV: test
          ALLOW_DEV_ACTOR_HEADERS: "false"
          JWT_SECRET: "ci-garage-os-certification-secret-2026-strong"
        run: npm test

      - name: Production build
        env:
          APP_ENV: production
          JWT_SECRET: "ci-garage-os-certification-secret-2026-strong"
        run: npm run build
